name: Finalize v2.4.1 source

on:
  push:
    paths:
      - '.sourceparts/**'
      - '.github/workflows/finalize-v241-source.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check source parts
        id: parts
        shell: bash
        run: |
          count=$(find .sourceparts -maxdepth 1 -type f -name 'part*.txt' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Rebuild Windrose.cs and clean temporary files
        if: steps.parts.outputs.count == '8'
        shell: bash
        run: |
          cat .sourceparts/part01.txt .sourceparts/part02.txt .sourceparts/part03.txt .sourceparts/part04.txt .sourceparts/part05.txt .sourceparts/part06.txt .sourceparts/part07.txt .sourceparts/part08.txt > Windrose.cs/Windrose.cs
          rm -rf .sourceparts
          rm -f .github/workflows/finalize-v241-source.yml

      - name: Commit finalized source
        if: steps.parts.outputs.count == '8'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v2.4.1: finalize plugin source'
          git push
